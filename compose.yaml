services:
  tailscale-proton:
    build: .
    container_name: tailscale-proton-exit
    hostname: ${TS_HOSTNAME:-tailscale-proton}
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ts-state:/var/lib/tailscale
    env_file:
      - .env

volumes:
  ts-state:
    driver: local
